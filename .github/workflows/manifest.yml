name: Update wallpapers list
on:
  workflow_dispatch:
  push:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'
      - '**.JPG'
      - '**.JPEG'
      - '**.PNG'
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate wallpapers.json
        run: |
          python3 - <<'PY'
          import os, json, subprocess, urllib.parse
          repo = os.environ["GITHUB_REPOSITORY"]
          exts = (".jpg", ".jpeg", ".png", ".webp")
          items = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith(".")]
              for f in files:
                  if not f.lower().endswith(exts):
                      continue
                  path = os.path.relpath(os.path.join(root, f), ".")
                  parts = path.split(os.sep)
                  cat = parts[0] if len(parts) > 1 else ""
                  ts = subprocess.run(["git", "log", "--diff-filter=A", "--format=%ct", "-1", "--", path], capture_output=True, text=True).stdout.strip()
                  url = "https://raw.githubusercontent.com/%s/main/%s" % (repo, urllib.parse.quote(path.replace(os.sep, "/")))
                  items.append({"url": url, "cat": cat, "t": int(ts or 0)})
          items.sort(key=lambda x: -x["t"])
          json.dump({"items": items}, open("wallpapers.json", "w"), ensure_ascii=False)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add wallpapers.json
          git diff --cached --quiet || (git commit -m "Update wallpapers.json" && git push)
